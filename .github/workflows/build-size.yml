name: Report build size

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-size-report-comments
  cancel-in-progress: false
  queue: max

jobs:
  report:
    name: update PR build-size report
    if: ${{ github.event_name == 'push' || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run deliberately checks out only the trusted default branch.
      # The reporter reads PR artifact metadata through the API and never executes PR code.
      - name: Check out trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Update build-size report comments
        run: node scripts/report-pr-artifact-size.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
